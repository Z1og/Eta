name: Build APK Only

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  JAVA_DISTRIBUTION: temurin
  JAVA_VERSION: 21

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --licenses 2>/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Build debug APK
        if: inputs.build_type == 'debug'
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        if: inputs.build_type == 'release'
        env:
          ETA_RELEASE_STORE_FILE: ${{ secrets.ETA_RELEASE_STORE_FILE }}
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -n "$ETA_RELEASE_STORE_FILE" ]]; then
            echo "${{ secrets.ETA_RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
            export ETA_RELEASE_STORE_FILE="app/release.keystore"
          fi
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        if: inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: Eta-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        if: inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: Eta-release
          path: app/build/outputs/apk/release/app-release.apk
