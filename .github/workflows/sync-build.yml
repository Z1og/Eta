name: Sync Skills & Build APK

on:
  # 每 4 小时自动同步（UTC 0/4/8/12/16/20 = 北京 8/12/16/20/0/4 点）
  schedule:
    - cron: '0 0,4,8,12,16,20 * * *'
  # 接收外部 webhook 触发（上游更新时可用 curl 触发）
  repository_dispatch:
    types: [hanshuang-codex-updated]
  # 手动触发
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug
      force_sync:
        description: 'Force full re-sync even without upstream changes'
        required: false
        default: false
        type: boolean
  # 推送到 main 时也构建
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/*.yml'

permissions:
  contents: write

concurrency:
  group: sync-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Job 1: 同步 + 适配 hanshuang-codex Skills
  # ──────────────────────────────────────────────
  sync-skills:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check_changes.outputs.has_changes }}
      skill_count: ${{ steps.adapt.outputs.skill_count }}
    steps:
      - name: Checkout Eta
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache hanshuang-codex repo
        uses: actions/cache@v4
        with:
          path: .cache/hanshuang-codex
          key: hanshuang-codex-${{ github.run_id }}
          restore-keys: |
            hanshuang-codex-

      - name: Fetch and adapt skills
        id: adapt
        run: |
          # 始终全量运行（--skip-fetch 仅在缓存确认有效时使用）
          python3 hanshuang-to-eta.py 2>&1

          # 部署到 builtin_skills（编译打包用）
          python3 hanshuang-to-eta.py --skip-fetch --builtin 2>&1

          # 输出 skill 数量（从 builtin_skills manifest 读取，确保准确）
          SKILL_COUNT=$(python3 -c "import json; print(len(json.load(open('app/src/main/assets/builtin_skills/manifest.json'))['skills']))")

          # 验证：如果 skill 数量少于 10，说明适配失败
          if [[ "$SKILL_COUNT" -lt 10 ]]; then
            echo "::error::Skill count ($SKILL_COUNT) is too low, adapter may have failed"
            exit 1
          fi

          echo "skill_count=$SKILL_COUNT" >> "$GITHUB_OUTPUT"
          echo "Adapted $SKILL_COUNT skills"

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet hanshuang-eta-skills/ app/src/main/assets/builtin_skills/; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No skill changes detected"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git diff --stat hanshuang-eta-skills/ app/src/main/assets/builtin_skills/ | tail -5
          fi

      - name: Commit skill changes
        if: steps.check_changes.outputs.has_changes == 'true' || inputs.force_sync == true
        run: |
          git config user.name "Z1og"
          git config user.email "59019705+Z1og@users.noreply.github.com"

          # 先暂存脚本产生的变更
          git add hanshuang-eta-skills/ app/src/main/assets/builtin_skills/

          # 先 fetch rebase，避免 push 被远程新提交拒
          git fetch origin main
          # 用 stash 方式避免 rebase 时 unstaged changes 报错
          git stash
          git rebase origin/main || {
            echo "::warning::Rebase failed, attempting merge"
            git rebase --abort 2>/dev/null || true
            git merge --no-edit origin/main
          }
          git stash pop || true

          git add hanshuang-eta-skills/ app/src/main/assets/builtin_skills/
          git commit -m "chore(skills): sync from hanshuang-codex ($(date +%Y-%m-%d))" || echo "Nothing to commit"
          git push origin HEAD:main

  # ──────────────────────────────────────────────
  # Job 2: 编译 APK（照搬上游已验证配置）
  # ──────────────────────────────────────────────
  build-apk:
    needs: sync-skills
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Eta
        uses: actions/checkout@v4

      - name: Determine build type
        id: build_type
        run: |
          # 默认 release，仅当明确选择 debug 时才走 debug
          if [[ "${{ inputs.build_type }}" == "debug" ]]; then
            echo "type=debug" >> "$GITHUB_OUTPUT"
          else
            echo "type=release" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK 37
        run: sdkmanager --channel=3 "platforms;android-37.0"

      - name: Build debug APK
        if: steps.build_type.outputs.type == 'debug'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache :app:assembleDebug --stacktrace
          echo "APK_PATH=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"

      - name: Build release APK
        if: steps.build_type.outputs.type == 'release'
        env:
          ETA_RELEASE_KEYSTORE_BASE64: ${{ secrets.ETA_RELEASE_KEYSTORE_BASE64 }}
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "$ETA_RELEASE_KEYSTORE_BASE64" || -z "$ETA_RELEASE_STORE_PASSWORD" || \
                -z "$ETA_RELEASE_KEY_ALIAS" || -z "$ETA_RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::Missing release signing secrets"
            exit 1
          fi
          printf '%s' "$ETA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/eta-release.jks"

          export ETA_RELEASE_STORE_FILE="$RUNNER_TEMP/eta-release.jks"
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache :app:assembleRelease --stacktrace
          echo "APK_PATH=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eta-${{ steps.build_type.outputs.type }}-${{ github.sha }}
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Create GitHub Release
        if: steps.build_type.outputs.type == 'release' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-${{ github.event.head_commit.timestamp || 'manual' }}
          name: "Eta v${{ github.run_number }} - ${{ steps.build_type.outputs.type }}"
          body: |
            Automated build from commit `${{ github.sha }}`

            **Skills**: ${{ needs.sync-skills.outputs.skill_count || 'N/A' }} adapted from hanshuang-codex
            **Build type**: ${{ steps.build_type.outputs.type }}
            **Date**: ${{ github.event.head_commit.timestamp || 'manual trigger' }}
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────
  # Job 3: 检查上游更新（仅通知，不阻塞）
  # ──────────────────────────────────────────────
  check-upstream:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Check for upstream changes
        run: |
          UPSTREAM_SHA=$(curl -s "https://api.github.com/repos/aimeoa/hanshuang-codex/commits/main" | jq -r '.sha')
          echo "Upstream latest: $UPSTREAM_SHA"
          if [[ -n "$UPSTREAM_SHA" && "$UPSTREAM_SHA" != "null" ]]; then
            echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_ENV"
          fi

      - name: Notify if update available
        if: env.upstream_sha != ''
        run: |
          echo "::notice::hanshuang-codex upstream has new commits ($upstream_sha). Skills will be synced in the next build."
